services:
  db:
    image: postgres:18-alpine
    container_name: dpg-db
    restart: always
    ports:
      - '${DATABASE_PORT}:5432'
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dpg-postgresdb:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p 5432']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - dpg_internal
  redis:
    image: redis:7.2-alpine
    container_name: dpg-redis
    ports:
      - '${REDIS_PORT}:6379'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    env_file:
      - .env
    restart: always
    command:
      - sh
      - -c
      - >
        exec redis-server --appendonly yes --appendfsync everysec --save "" --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru} ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}

    volumes:
      - dpg-redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - dpg_internal
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: dpg-monorepo/api:local
    container_name: dpg-api
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_PORT: 2742
    ports:
      - '${API_PORT:-2742}:2742'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      scoring:
        condition: service_healthy
    networks:
      - dpg_internal
  scoring:
    image: dpg-scoring:local
    container_name: dpg-scoring
    restart: always
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AUTH_SECRETS_FILE: /app/config/auth.keys.json
      AI_PROVIDER_SECRETS_FILE: /app/config/ai.providers.local.json
      MATCH_SCORE_PROVIDER: openai
      MATCH_SCORE_MODEL: gpt-4o-mini
    ports:
      - '${SCORING_PORT:-3007}:3000'
    volumes:
      - ../dpg-scoring/config/auth.keys.json:/app/config/auth.keys.json:ro
      - ../dpg-scoring/config/ai.providers.local.json:/app/config/ai.providers.local.json:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ready').then((r)=>{ if(!r.ok) process.exit(1); }).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dpg_internal
  notification-service:
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    image: dpg-monorepo/notification-service:local
    container_name: dpg-notification-service
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SERVER_PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      INTERNAL_SECRETS_JSON: /app/config/internal-secrets.json
      SMTP_GMAIL: "true"
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_PASS: ${GMAIL_PASS}
      SMTP_AWS_SES: ""
      SEND_WHATSAPP_NOTIFICATION: ""
      MAIL_LOG: "true"
      LOG_ACTIVITY: "true"
    ports:
      - '${NOTIFICATION_SERVICE_PORT:-3000}:3000'
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../notification-service/config/internal-secrets.json:/app/config/internal-secrets.json:ro
    networks:
      - dpg_internal
  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
      args:
        VITE_DEFAULT_API_URL: ${API_DOMAIN}:${API_PORT}
    image: dpg-monorepo/ui:local
    container_name: dpg-ui
    restart: always
    ports:
      - '${UI_PORT:-8082}:80'
    depends_on:
      - api
    networks:
      - dpg_internal
  schemas:
    image: nginx:1.27-alpine
    container_name: dpg-schemas
    restart: always
    environment:
      INSTANCE_URL: ${API_DOMAIN}:${API_PORT}
    volumes:
      - ./examples/schemas:/raw:ro
    command:
      - sh
      - -c
      - |
        set -e
        cp -r /raw/. /usr/share/nginx/html
        find /usr/share/nginx/html -type f -name '*.json' -exec \
          sed -i "s|__PUBLIC_API_URL__|$$INSTANCE_URL|g" {} +
        exec nginx -g 'daemon off;'
    networks:
      - dpg_internal
networks:
  dpg_internal:
    name: dpg_internal
    internal: false
volumes:
  dpg-postgresdb:
    name: dpg-postgresdb
  dpg-redis:
    name: dpg-redis
